name: Sinkronkan aturan Firebase

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - "alat/deploy-firestore-rules.mjs"
      - ".github/workflows/deploy-firestore-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aturan:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Periksa sumber aturan
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'match /bansos_penerima/{id}' firestore.rules
          grep -q 'allow read, create, update, delete: if petugas();' firestore.rules
          grep -q 'match /login_petugas/{username}' firestore.rules
          grep -q 'allow list: if false;' firestore.rules
          grep -q 'match /usaha_bukti/{id}' firestore.rules
          grep -q 'match /video-kegiatan/{namaFile}' storage.rules
          grep -q 'request.resource.contentType.matches' storage.rules
          grep -q '"storage"' firebase.json
          echo "Aturan Firestore dan Storage ditemukan."

      - name: Deploy aturan Firebase
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          PROJECT="perumahansukatanirw02"

          # Service account menggunakan Rules Management API langsung agar
          # tidak bergantung pada Service Usage Viewer. Skrip merilis aturan
          # Firestore dan Cloud Storage dalam satu proses.
          if [[ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            node alat/deploy-firestore-rules.mjs "$PROJECT"
          elif [[ -n "${GCP_SA_KEY:-}" ]]; then
            printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            node alat/deploy-firestore-rules.mjs "$PROJECT"
          elif [[ -n "${FIREBASE_TOKEN:-}" ]]; then
            npx --yes firebase-tools@latest deploy --only firestore:rules,storage --project "$PROJECT" --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "::error::Belum ada FIREBASE_SERVICE_ACCOUNT, GCP_SA_KEY, atau FIREBASE_TOKEN di GitHub Secrets."
            exit 1
          fi
