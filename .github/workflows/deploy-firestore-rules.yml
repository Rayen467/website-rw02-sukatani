name: Sinkronkan aturan Firestore

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - "alat/deploy-firestore-rules.mjs"
      - ".github/workflows/deploy-firestore-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aturan:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Periksa sumber aturan
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'match /bansos_penerima/{id}' firestore.rules
          grep -q 'allow read, create, update, delete: if petugas();' firestore.rules
          grep -q 'match /login_petugas/{username}' firestore.rules
          grep -q 'allow list: if false;' firestore.rules
          grep -q 'match /usaha_bukti/{id}' firestore.rules
          echo "Aturan privat bansos, alias login Petugas, dan bukti UMKM ditemukan."

      - name: Deploy aturan Firestore
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          PROJECT="perumahansukatanirw02"

          # Untuk service account, gunakan Firebase Rules Management API resmi
          # langsung. Ini membutuhkan firebaserules.* saja dan tidak memerlukan
          # Service Usage Viewer yang sebelumnya membuat Firebase CLI gagal 403.
          if [[ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            node alat/deploy-firestore-rules.mjs "$PROJECT"
          elif [[ -n "${GCP_SA_KEY:-}" ]]; then
            printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            node alat/deploy-firestore-rules.mjs "$PROJECT"
          elif [[ -n "${FIREBASE_TOKEN:-}" ]]; then
            npx --yes firebase-tools@latest deploy --only firestore:rules --project "$PROJECT" --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "::error::Belum ada FIREBASE_SERVICE_ACCOUNT, GCP_SA_KEY, atau FIREBASE_TOKEN di GitHub Secrets."
            exit 1
          fi
