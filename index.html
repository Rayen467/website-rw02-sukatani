<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Situs informasi warga RW 02 Perum Permai Sukatani, Desa Sukatani, Kecamatan Rajeg, Kabupaten Tangerang." />
    <title>Warga Permai Sukatani</title>
    <link rel="icon" type="image/png" href="https://d2ol7oe51mr4n9.cloudfront.net/user_3J2DcrlVJWc07vYNUqg33j72Wvv/f2bd27c4-a085-4824-923f-410a06b0adb2.png" />

    <!--
      DESIGN SYSTEM WAJIB RW 02 SUKATANI
      Sora    : judul/headline
      Poppins : body dan seluruh UI
      Jangan menambah/mengganti keluarga font tanpa mengubah design system.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
    />
    <link rel="stylesheet" href="./informasi-waktu.css" />

    <script>
      /* Memasang tema sebelum halaman tergambar, supaya tidak berkedip putih
         sesaat bagi warga yang memilih tampilan gelap. */
      (function () {
        try {
          var t = localStorage.getItem("tema");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
