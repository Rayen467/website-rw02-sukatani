<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Situs informasi warga RW 02 Perum Permai Sukatani, Desa Sukatani, Kecamatan Rajeg, Kabupaten Tangerang." />
    <title>Warga Permai Sukatani</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />

    <script>
      /* Memasang tema sebelum halaman tergambar, supaya tidak berkedip putih
         sesaat bagi warga yang memilih tampilan gelap. */
      (function () {
        try {
          var t = localStorage.getItem("tema");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
